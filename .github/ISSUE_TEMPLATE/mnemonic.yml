name: 📚 Thêm/Sửa mẹo nhớ HSK
description: Nhập mẹo nhớ đầy đủ 5 phần cho từ vựng HSK
title: "[Mnemonic] HSK1 - "
labels: ["mnemonic", "automated"]
body:
  - type: markdown
    attributes:
      value: |
        ## 📚 Nhập mẹo nhớ cho từ vựng HSK

        Đingền đầy đủ **5 phần**ắ bên dưới → bot sẽ tự động ghép thành mẹo nhớ hoàn chỉnh.

        ⚡ **Sau khi submit, đợi 1-2 phút để web cập nhật.**

  - type: dropdown
    id: hsk
    attributes:
      label: HSK
      description: Chọn cấp độ (HSK 7-9 chọn đúng sheet)
      options:
        - HSK1
        - HSK2
        - HSK3
        - HSK4
        - HSK5
        - HSK6
        - HSK 7-9 (1)
        - HSK 7-9 ( 2)
        - HSK 7-9 (3)
    validations:
      required: true

  - type: input
    id: stt
    attributes:
      label: STT
      description: Số thứ tự của từ trong file Excel
      placeholder: "VD: 4"
    validations:
      required: true

  - type: input
    id: zh
    attributes:
      label: Chữ Hán
      description: Chữ Hán của từ vựng
      placeholder: "VD: 爸爸"
    validations:
      required: true

  - type: input
    id: pinyin
    attributes:
      label: Pinyin
      description: Phiên âm
      placeholder: "VD: bàba"
    validations:
      required: true

  - type: input
    id: vi
    attributes:
      label: Nghĩa tiếng Việt
      description: Nghĩa của từ
      placeholder: "VD: Bố; ba"
    validations:
      required: true

  - type: input
    id: radical
    attributes:
      label: Bộ thủ (tùy chọn)
      description: "Format: 父|fù|4|Cha"
      placeholder: "VD: 父|fù|4|Cha"

  - type: markdown
    attributes:
      value: |
        ---
        ### 📝 Nhập 5 phần mẹo nhớ
        Mỗi phần nhập **n gọn 1-3 câu**.

  - type: textarea
    id: chiet_tu
    attributes:
      label: 💡 Chiết tự
      description: Phân tích chữ Hán thành các bộ thủ, ghép nghĩa
      placeholder: |
        VD: 父 (bộ phụ - cha) + 巴 (ba - mong ước) → Người cha mong ước điều tốt cho con = BỐ, CHA
      render: text
    validations:
      required: true

  - type: textarea
    id: am_thanh
    attributes:
      label: 📌 Âm thanh
      description: Liên tưởng âm Hán-Việt + câu vè dễ nhớ
      placeholder: |
        VD: "bàba" ≈ "ba ba" (đọc 2 lần, gọi ba). Câu vè: "Ba ba ơi, ba ba à, bố yêu con nhất trên đời"
      render: text
    validations:
      required: true

  - type: textarea
    id: cau_chuyen
    attributes:
      label: 🎬 Câu chuyện
      description: 1 đoạn ngắn 2-3 câu có ngữ cảnh sử dụng từ
      placeholder: |
        VD: Bé Tí tan học chạy về nhà, thấy ba đang sửa xe dưới nắng. Bé chạy tới ôm chầm lấy ba, miệng líu lo: "爸爸, 爸爸!" (bàba, bàba) — hai tiếng gọi nghe đến não lòng, khiến bố Tí rơm rớm nước mắt vì hạnh phúc.
      render: text
    validations:
      required: true

  - type: textarea
    id: vi_du
    attributes:
      label: 📎 Ví dụ
      description: "Câu tiếng Trung + pinyin + nghĩa (format: 中文 (pinyin) - nghĩa)"
      placeholder: |
        VD: 爸爸去哪儿了? (Bàba qù nǎr le?) - Bố đi đâu rồi?
      render: text
    validations:
      required: true

  - type: textarea
    id: lien_quan
    attributes:
      label: 🔗 Liên quan
      description: "3-5 từ cùng chủ đề (format: từ (pinyin - nghĩa), từ (pinyin - nghĩa))"
      placeholder: |
        VD: 妈妈 (māma - mẹ), 哥哥 (gēge - anh trai), 姐姐 (jiějie - chị gái), 弟弟 (dìdi - em trai)
      render: text
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Xác nhận
      options:
        - label: Tôi đã kiểm tra dữ liệu chính xác
          required: true
