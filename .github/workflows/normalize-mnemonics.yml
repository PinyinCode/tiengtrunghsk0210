name: Normalize AI Mnemonics

on:
  push:
    branches: [ main, master ]
    paths:
      - 'data/ai_mnemonics.json'
      - 'normalize_mnemonics.py'
      - '.github/workflows/normalize-mnemonics.yml'

  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Custom commit message'
        required: false
        default: 'Auto-normalize ai_mnemonics.json'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    name: Normalize example format

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check files
        run: |
          echo "=== Check files ==="
          ls -la data/ai_mnemonics.json || echo "MISSING ai_mnemonics.json"
          ls -la normalize_mnemonics.py || echo "MISSING normalize script"

      - name: Run normalize
        id: normalize
        run: |
          echo "=== Start normalize ==="
          python normalize_mnemonics.py

          echo "=== Check changes ==="
          if git diff --quiet data/ai_mnemonics.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes - file already normalized"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi

      - name: Show diff stats
        if: steps.normalize.outputs.changed == 'true'
        run: |
          echo "=== Diff stats ==="
          git diff --stat data/ai_mnemonics.json

          echo "=== First 50 lines of diff ==="
          git diff data/ai_mnemonics.json | head -50

      - name: Commit and push
        if: steps.normalize.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          rm -f data/ai_mnemonics.json.bak_* || true

          git add data/ai_mnemonics.json

          MSG="${{ github.event.inputs.commit_message || 'Auto-normalize ai_mnemonics.json' }}"
          git commit -m "$MSG [skip ci]"
          git push

      - name: Result
        run: |
          if [ "${{ steps.normalize.outputs.changed }}" == "true" ]; then
            echo "Normalized and committed"
          else
            echo "File already normalized"
          fi
