name: Fix Mnemonics (Qwen)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "So entry can fix (0 = tat ca)"
        required: true
        default: "20"
      only_hsk:
        description: "Chi fix HSK nao (VD: HSK1,HSK2). Trong = tat ca"
        required: false
        default: ""
      delay:
        description: "Delay giua cac request (giay)"
        required: true
        default: "2.0"
      auto_commit:
        description: "Tu dong commit? (1=on, 0=off)"
        required: true
        default: "0"
      qwen_model:
        description: "Qwen model (VD: qwen-flash, qwen-plus-character)"
        required: true
        default: "qwen-flash"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai openpyxl cn2an jieba

      - name: Verify input
        run: |
          if [ ! -f "data/ai_mnemonics.json" ]; then
            echo "Khong tim thay data/ai_mnemonics.json"
            exit 1
          fi
          echo "Tim thay data/ai_mnemonics.json"
          python -c "import json; d=json.load(open('data/ai_mnemonics.json')); print('Tong entries:', len(d))"

      - name: Test imports
        run: |
          python -c "from vocab_data.radical_analyzer import get_radical_for_word; print('radical_analyzer OK')"
          python -c "from vocab_data.radicals_db import get_radical_info; print('radicals_db OK')"

      - name: Run fix mnemonics
        continue-on-error: true
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_MODEL: ${{ github.event.inputs.qwen_model }}
          LIMIT: ${{ github.event.inputs.limit }}
          ONLY_HSK: ${{ github.event.inputs.only_hsk }}
          DELAY: ${{ github.event.inputs.delay }}
          LOG_EVERY: "5"
          MAX_RETRIES: "2"
        run: |
          echo "Model: $QWEN_MODEL"
          echo "LIMIT: $LIMIT"
          echo "ONLY_HSK: ${ONLY_HSK:-'(tat ca)'}"
          echo "DELAY: ${DELAY}s"
          echo "y" | python vocab_data/fix_mnemonics_qwen.py

      - name: Show diff summary
        if: always()
        run: |
          echo "DIFF SUMMARY"
          git diff --stat data/ai_mnemonics.json || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnemonics-output-${{ github.run_number }}
          path: |
            data/ai_mnemonics.json
            data/ai_mnemonics.backup_*.json
          retention-days: 7
          if-no-files-found: warn

      - name: Rebuild index.html
        if: always()
        continue-on-error: true
        run: python fix.py

      - name: Commit output
        if: always() && github.event.inputs.auto_commit == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Khong co thay doi"
          else
            git commit -m "Fix AI mnemonics (radical correct) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
