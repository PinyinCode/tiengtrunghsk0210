name: Fix Mnemonics (Qwen)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "So entry can fix (0 = tat ca)"
        required: true
        default: "20"
      only_hsk:
        description: "Chi fix HSK nao (VD: HSK1,HSK2). Trong = tat ca"
        required: false
        default: ""
      delay:
        description: "Delay giua cac request (giay)"
        required: true
        default: "2.0"
      auto_commit:
        description: "Tu dong commit? (1=on, 0=off)"
        required: true
        default: "0"
      qwen_model:
        description: "Qwen model (VD: qwen-flash, qwen-plus)"
        required: true
        default: "qwen-flash"
      debug_db:
        description: "In danh sach chu bi thieu trong DB? (1=on, 0=off)"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai openpyxl cn2an jieba cjkradlib

      - name: Verify input
        run: |
          if [ ! -f "data/ai_mnemonics.json" ]; then
            echo "Khong tim thay data/ai_mnemonics.json"
            exit 1
          fi
          echo "Tim thay data/ai_mnemonics.json"
          python -c "import json; d=json.load(open('data/ai_mnemonics.json')); print('Tong entries:', len(d))"

      - name: Test imports
        run: |
          python -c "from vocab_data.radical_analyzer import get_radical_for_word; print('radical_analyzer OK')"
          python -c "from vocab_data.radicals_db import get_radical_info; print('radicals_db OK')"

      - name: Debug DB missing chars
        if: github.event.inputs.debug_db == '1'
        continue-on-error: true
        run: |
          python - <<'PYEOF'
          import os, sys, json
          sys.path.insert(0, os.getcwd())
          from vocab_data.radical_analyzer import get_radical_for_word

          data = json.load(open('data/ai_mnemonics.json'))
          missing = []
          total_single = 0

          for key in data:
              parts = key.split('|')
              if len(parts) != 3:
                  continue
              zh = parts[2].strip()
              if len(zh) != 1:
                  continue
              total_single += 1
              try:
                  rad = get_radical_for_word(zh)
                  if not rad or not rad.get('zh'):
                      missing.append((key, zh))
              except Exception:
                  missing.append((key, zh))

          print('=' * 60)
          print('DEBUG: CHU HAN THIEU TRONG radicals_db')
          print('=' * 60)
          print(f'Tong chu don: {total_single}')
          print(f'Tong DB thieu: {len(missing)}')
          print()
          print('20 chu dau tien bi thieu:')
          for key, zh in missing[:20]:
              print(f'  {key} -> {zh}')
          print()
          all_missing_chars = sorted(set(zh for _, zh in missing))
          print(f'Tong so chu unique: {len(all_missing_chars)}')
          print('Tat ca chu (de bo sung DB):')
          print(''.join(all_missing_chars))
          print()
          with open('debug_missing_chars.json', 'w', encoding='utf-8') as f:
              json.dump({
                  'total_single': total_single,
                  'total_missing': len(missing),
                  'missing_entries': [{'key': k, 'zh': z} for k, z in missing],
                  'unique_chars': all_missing_chars,
              }, f, ensure_ascii=False, indent=2)
          print('Da ghi debug_missing_chars.json')
          PYEOF

      - name: Debug sample mnemonics
        if: github.event.inputs.debug_db == '1'
        continue-on-error: true
        run: |
          python - <<'PYEOF'
          import json
          data = json.load(open('data/ai_mnemonics.json'))

          print('=' * 60)
          print('DEBUG: 3 MNEMONIC MAU')
          print('=' * 60)

          count = 0
          for key, mnemonic in data.items():
              if count >= 3:
                  break
              if mnemonic and '💡' in mnemonic and '📌' in mnemonic:
                  print(f'\n--- {key} ---')
                  print(mnemonic[:500])
                  count += 1

          if count == 0:
              print('Chua co mnemonic nao dang 5 dong')
          PYEOF

      - name: Run fix mnemonics
        continue-on-error: true
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_MODEL: ${{ github.event.inputs.qwen_model }}
          LIMIT: ${{ github.event.inputs.limit }}
          ONLY_HSK: ${{ github.event.inputs.only_hsk }}
          DELAY: ${{ github.event.inputs.delay }}
          LOG_EVERY: "5"
          MAX_RETRIES: "2"
        run: |
          echo "Model: $QWEN_MODEL"
          echo "LIMIT: $LIMIT"
          echo "ONLY_HSK: ${ONLY_HSK:-'(tat ca)'}"
          echo "DELAY: ${DELAY}s"
          echo "y" | python vocab_data/fix_mnemonics_qwen.py

      - name: Show diff summary
        if: always()
        run: |
          echo "DIFF SUMMARY"
          git diff --stat data/ai_mnemonics.json || true

      # ============================================================
      # SHOW CHANGED ENTRIES - In ra entries nao bi sua
      # ============================================================
      - name: Show changed entries
        if: always()
        continue-on-error: true
        run: |
          python - <<'PYEOF'
          import json
          import glob

          backups = sorted(glob.glob("data/ai_mnemonics.backup_*.json"))
          if not backups:
              print("Khong co backup de so sanh")
              exit(0)

          old_file = backups[0]
          print("=" * 60)
          print(f"SO SANH: {old_file}")
          print("         VS data/ai_mnemonics.json")
          print("=" * 60)

          try:
              with open(old_file, encoding="utf-8") as f:
                  old_data = json.load(f)
              with open("data/ai_mnemonics.json", encoding="utf-8") as f:
                  new_data = json.load(f)
          except Exception as e:
              print(f"Loi doc file: {e}")
              exit(0)

          changed = []
          for k in new_data:
              if new_data.get(k) != old_data.get(k):
                  changed.append(k)

          print(f"Tong entries thay doi: {len(changed)}")
          print()
          print("20 entries dau tien:")
          for k in changed[:20]:
              print(f"  {k}")
          print()

          print("=" * 60)
          print("CHI TIET 3 ENTRIES DAU (CU vs MOI)")
          print("=" * 60)
          for k in changed[:3]:
              print(f"\n### {k} ###")
              print("--- CU ---")
              print((old_data.get(k) or "")[:400])
              print("--- MOI ---")
              print((new_data.get(k) or "")[:400])
              print()
          PYEOF

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnemonics-output-${{ github.run_number }}
          path: |
            data/ai_mnemonics.json
            data/ai_mnemonics.backup_*.json
            debug_missing_chars.json
          retention-days: 7
          if-no-files-found: warn

      - name: Rebuild index.html
        if: always()
        continue-on-error: true
        run: python fix.py

      - name: Commit output
        if: always() && github.event.inputs.auto_commit == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Khong co thay doi"
          else
            git commit -m "Fix AI mnemonics (radical correct) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
