name: Convert Excel to HTML

on:
  push:
    paths:
      # ⭐ File Excel: input.xlsx + Giao_tiếp.xlsx (đặt trong data/)
      - 'data/**'
      # File chuyên ngành
      - 'scripts/data/**'
      # Code Python
      - 'scripts/**/*.py'
      - 'scripts/config.json'
      # ⭐ FIX.PY — chạy sau convert.py để thêm tab từ data/
      - 'fix.py'
      - 'patch_buttons.py'
      # ⭐ VOCAB PREMIUM — module từ vựng
      - 'vocab_premium.py'
      - 'vocab_data/**'
      - 'requirements.txt'
      # Workflow tự nó
      - '.github/workflows/convert.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl cn2an pypinyin jieba pandas hanzidentifier cjkradlib

      - name: Verify dependencies
        run: |
          python -c "import openpyxl; print('✅ openpyxl', openpyxl.__version__)"
          python -c "import cn2an;   print('✅ cn2an', cn2an.__version__)"
          python -c "import pypinyin; print('✅ pypinyin', pypinyin.__version__)"
          python -c "import jieba;   print('✅ jieba OK')"
          python -c "import pandas;  print('✅ pandas', pandas.__version__)"

      # ⭐ VERIFY MODULE TỪ VỰNG
      - name: Verify vocab modules
        run: |
          echo "=== Kiểm tra module từ vựng ==="
          
          if [ -f vocab_premium.py ]; then
            echo "✅ Có file vocab_premium.py"
            python -c "from vocab_premium import read_vocab_excel, build_vocab_css, build_vocab_tab_html, build_vocab_modal_html, build_vocab_js_override; print('✅ vocab_premium imports OK')" || {
              echo "❌ Lỗi import vocab_premium"
              exit 1
            }
          else
            echo "⚠️  Không có vocab_premium.py — tab Từ vựng sẽ không xuất hiện"
          fi
          
          if [ -d vocab_data ]; then
            echo "✅ Có thư mục vocab_data/"
            ls -la vocab_data/
            python -c "from vocab_data.radicals_db import RADICALS; print('✅ radicals_db OK (' + str(len(RADICALS)) + ' bộ thủ)')" || echo "⚠️ radicals_db lỗi"
            python -c "from vocab_data.radical_analyzer import get_radical_for_word; print('✅ radical_analyzer OK')" || echo "⚠️ radical_analyzer lỗi"
            python -c "from vocab_data.mnemonic_generator import generate_mnemonic; print('✅ mnemonic_generator OK')" || echo "⚠️ mnemonic_generator lỗi"
          else
            echo "⚠️  Không có vocab_data/ — tab Từ vựng sẽ không có mẹo nhớ/bộ thủ"
          fi

      - name: List files
        run: |
          echo "=== Root ==="
          ls -la
          echo ""
          echo "=== data/ (cho fix.py) ==="
          ls -la data/ || echo "No data folder"
          echo ""
          echo "=== scripts/ ==="
          ls -la scripts/
          echo ""
          echo "=== scripts/data/ (cho convert.py) ==="
          ls -la scripts/data/ || echo "No scripts/data folder"
          echo ""
          echo "=== vocab_data/ ==="
          ls -la vocab_data/ 2>/dev/null || echo "No vocab_data folder"

      - name: Test cn2an conversion
        run: |
          python -c "
          import cn2an
          tests = [500, 480, 20, 50, 30]
          for n in tests:
              print(f'  {n} → {cn2an.an2cn(n)}')
          "

      - name: Pre-flight check
        run: python scripts/check.py

      # ═══════════════════════════════════════════════════════════════
      #  BƯỚC 1: Build index.html gốc (tổng hợp + chuyên ngành)
      # ═══════════════════════════════════════════════════════════════
      - name: Run convert script (build gốc)
        run: python scripts/convert.py

      # ═══════════════════════════════════════════════════════════════
      #  VERIFY sau convert
      # ═══════════════════════════════════════════════════════════════
      - name: Verify index.html after convert
        run: |
          if [ ! -f index.html ]; then
            echo "❌ ERROR: index.html not found after convert.py"
            exit 1
          fi

          SIZE=$(stat -c%s index.html)
          echo "📦 index.html size: $SIZE bytes"
          echo ""

          if [ "$SIZE" -lt 500000 ]; then
            echo "❌ index.html quá nhỏ (< 500KB) — có thể lỗi build"
            exit 1
          fi
          echo "✅ Size OK (> 500KB)"
          echo ""

          echo "=== Check core infrastructure (BẮT BUỘC) ==="
          REQUIRED=(
            "RAW_DATA"
            "DATASET_REGISTRY"
            "FIREBASE_CONFIG"
            "firebase-app-compat"
            "CURRENT_DATASET"
          )
          for el in "${REQUIRED[@]}"; do
            if grep -q "$el" index.html; then
              echo "  ✅ $el"
            else
              echo "  ❌ MISSING $el"
              exit 1
            fi
          done
          echo ""

          echo "=== Check HTML structure ==="
          OPEN_SCRIPT=$(grep -o "<script" index.html | wc -l)
          CLOSE_SCRIPT=$(grep -o "</script>" index.html | wc -l)
          echo "  <script>: $OPEN_SCRIPT"
          echo "  </script>: $CLOSE_SCRIPT"
          if [ "$OPEN_SCRIPT" -ne "$CLOSE_SCRIPT" ]; then
            echo "  ❌ Số thẻ script KHÔNG khớp!"
            exit 1
          fi
          echo "  ✅ Thẻ script cân bằng"

      # ═══════════════════════════════════════════════════════════════
      #  BƯỚC 2: Patch — thêm tab riêng cho MỌI file trong data/
      # ═══════════════════════════════════════════════════════════════
      - name: Run fix.py (thêm tab từ data/)
        run: |
          if [ -f fix.py ]; then
            python fix.py
          else
            echo "ℹ️️  Không có fix.py — bỏ qua bước patch"
          fi

      # ═══════════════════════════════════════════════════════════════
      #  VERIFY sau patch
      # ═══════════════════════════════════════════════════════════════
      - name: Verify datasets loaded
        run: |
          echo "=== Kiểm tra bộ dữ liệu trong index.html ==="

          if grep -q '"tonghop"' index.html; then
            echo "  ✅ dataset 'tonghop' found"
          else
            echo "  ❌ dataset 'tonghop' MISSING"
            exit 1
          fi

          echo ""
          echo "=== Kiểm tra file trong data/ ==="
          if [ -d "data" ]; then
            FOUND=0
            for f in data/*.xlsx data/*.xls data/*.csv; do
              [ -e "$f" ] || continue
              FNAME=$(basename "$f")
              case "$FNAME" in
                ~\$*) continue ;;
              esac
              echo "  📄 File: $FNAME"
              FOUND=$((FOUND + 1))
            done
            if [ $FOUND -eq 0 ]; then
              echo "  ℹ️️  Không có file Excel nào trong data/"
            fi
          else
            echo "  ℹ️  Không có thư mục data/"
          fi

          # Kiểm tra tab Giao tiếp
          if [ -f "data/Giao_tiếp.xlsx" ] || [ -f "data/giao-tiep.xlsx" ] || [ -f "data/Giao_tiep.xlsx" ]; then
            if grep -q '"giaotiep"' index.html; then
              echo "  ✅ Tab 'Giao Tiếp' found"
            else
              echo "  ⚠️  Tab 'Giao Tiếp' MISSING"
            fi
          fi

          if grep -q 'FIX.PY: AUTO-FIT LAYOUT' index.html; then
            echo "  ✅ CSS override từ fix.py có mặt"
          else
            echo "  ℹ️  Không có CSS override"
          fi

          # ⭐ KIỂM TRA TAB TỪ VỰNG PREMIUM
          if [ -f "data/tu_vung_hsk.xlsx" ]; then
            echo ""
            echo "=== Kiểm tra tab Từ vựng Premium ==="
            
            if grep -q 'data-dataset="tu-vung"' index.html; then
              echo "  ✅ Tab 'Từ vựng Premium' found"
            else
              echo "  ⚠️  Tab 'Từ vựng' MISSING — kiểm tra log fix.py"
            fi
            
            if grep -q 'vocab-upgrade-modal' index.html; then
              echo "  ✅ Modal upgrade Premium found"
            else
              echo "  ⚠️  Modal upgrade MISSING"
            fi
            
            if grep -q 'card-radical' index.html; then
              echo "  ✅ CSS block Bộ thủ found"
            else
              echo "  ⚠️  CSS Bộ thủ MISSING"
            fi
            
            if grep -q 'card-mnemonic' index.html; then
              echo "  ✅ CSS block Mẹo nhớ found"
            else
              echo "  ⚠️  CSS Mẹo nhớ MISSING"
            fi
            
            if grep -q 'vocab-locked' index.html; then
              echo "  ✅ CSS tab locked found"
            else
              echo "  ⚠️  CSS tab locked MISSING"
            fi
          else
            echo ""
            echo "  ℹ️  Không có file data/tu_vung_hsk.xlsx — bỏ qua verify tab Từ vựng"
          fi

      - name: Verify numbers converted
        run: |
          echo "=== Kiểm tra số Ả Rập trong index.html ==="
          if grep -q "五百" index.html; then
            echo "✅ Tìm thấy '五百'"
          else
            echo "⚠️  Không tìm thấy '五百'"
          fi
          if grep -q "四百八十" index.html; then
            echo "✅ Tìm thấy '四百八十'"
          else
            echo "⚠️  Không tìm thấy '四百八十'"
          fi

      # ═══════════════════════════════════════════════════════════════
      #  COMMIT & PUSH
      # ═══════════════════════════════════════════════════════════════
      - name: Commit & push index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --quiet && git diff --staged --quiet; then
            echo "✅ Không có thay đổi để commit"
          else
            git commit -m "🤖 Auto convert Excel to HTML [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      # ═══════════════════════════════════════════════════════════════
      #  UPLOAD ARTIFACT
      # ═══════════════════════════════════════════════════════════════
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          [ -d "assets" ] && cp -r assets _site/ || true
          [ -d "static" ] && cp -r static _site/ || true
          [ -f "404.html" ] && cp 404.html _site/ || true
          echo "=== Artifact contents ==="
          ls -la _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: convert
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
