name: Convert Excel to HTML

on:
  push:
    paths:
      - 'data/**'
      - 'scripts/data/**'
      - 'scripts/**/*.py'
      - 'scripts/config.json'
      - 'fix.py'
      - 'fix_name.py'
      - 'requirements.txt'
      - '.github/workflows/convert.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl cn2an pypinyin jieba pandas

      - name: Verify dependencies
        run: |
          python -c "import openpyxl; print('openpyxl OK')"
          python -c "import cn2an; print('cn2an OK')"
          python -c "import pypinyin; print('pypinyin OK')"
          python -c "import jieba; print('jieba OK')"
          python -c "import pandas; print('pandas OK')"

      - name: List files
        run: |
          echo "Root:"
          ls -la
          echo "data/:"
          ls -la data/ || true
          echo "scripts/:"
          ls -la scripts/
          echo "scripts/data/:"
          ls -la scripts/data/ || true

      - name: Pre-flight check
        run: python scripts/check.py

      - name: Run convert.py
        run: python scripts/convert.py

      - name: Verify index.html after convert
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          SIZE=$(stat -c%s index.html)
          echo "index.html size: $SIZE bytes"

          if [ "$SIZE" -lt 500000 ]; then
            echo "ERROR: index.html too small"
            exit 1
          fi

          for EL in RAW_DATA DATASET_REGISTRY FIREBASE_CONFIG CURRENT_DATASET; do
            if grep -q "$EL" index.html; then
              echo "OK: $EL"
            else
              echo "ERROR: missing $EL"
              exit 1
            fi
          done

          OPEN_COUNT=$(grep -o "<script" index.html | wc -l)
          CLOSE_COUNT=$(grep -o "</script>" index.html | wc -l)
          echo "script tags: open=$OPEN_COUNT close=$CLOSE_COUNT"
          if [ "$OPEN_COUNT" -ne "$CLOSE_COUNT" ]; then
            echo "ERROR: script tags mismatch"
            exit 1
          fi

      - name: Run fix.py
        run: |
          if [ -f fix.py ]; then
            python fix.py
          else
            echo "No fix.py, skipping"
          fi

      - name: Run fix_name.py
        run: |
          if [ -f fix_name.py ]; then
            python fix_name.py
          elif [ -f scripts/fix_name.py ]; then
            python scripts/fix_name.py
          else
            echo "No fix_name.py, skipping"
          fi

      - name: Verify final output
        run: |
          if grep -q '"tonghop"' index.html; then
            echo "OK: tonghop dataset"
          else
            echo "ERROR: missing tonghop"
            exit 1
          fi

          if grep -q 'FIX_NAME.PY' index.html; then
            echo "OK: fix_name patch applied"
          else
            echo "WARN: fix_name patch not found"
          fi

          if grep -q 'ds-sub-name' index.html; then
            echo "OK: ds-sub-name class"
          else
            echo "WARN: ds-sub-name class not found"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto convert Excel to HTML [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          if [ -d "assets" ]; then cp -r assets _site/; fi
          if [ -d "static" ]; then cp -r static _site/; fi
          if [ -f "404.html" ]; then cp 404.html _site/; fi
          echo "Artifact contents:"
          ls -la _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: convert
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
