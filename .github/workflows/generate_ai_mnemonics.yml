name: Generate AI Mnemonics

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Số từ cần sinh (0 = tất cả)"
        required: true
        default: "20"
      resume:
        description: "Bỏ qua từ đã có? (1=on, 0=off)"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai openpyxl cn2an jieba

      - name: Verify API key
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          if [ -z "$DASHSCOPE_API_KEY" ]; then
            echo "Chua set DASHSCOPE_API_KEY"
            exit 1
          fi
          echo "OK - API key set"

      - name: Run AI generatorgit
        continue-on-error: true
        env commit:
          DASHSCOPE_API -_KEY: ${{ secrets.DASHSmCOPE_API_KEY }}
          QWEN "_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_MODEL: ${{ secrets.QWEN_MODEL }}
          DEMO_LIMIT: ${{ github.event.inputs.limit }}
          RESUME: ${{ github.event.inputs.resume }}
        run: python vocab_data/ai_mnemonic_generator.py

      - name: Rebuild index.html
        if: always()
        continue-on-error: true
        run: python fix.py

      - name: Commit output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Khong co thay doi"
          else
            git commit -m "Update AI mnemonics [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
