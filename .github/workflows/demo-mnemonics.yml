name: Demo Mnemonics (Qwen-Plus)

on:
  workflow_dispatch:
    inputs:
      demo_limit:
        description: 'Số từ test'
        required: false
        default: '10'
      tmodel:
        description: 'Model AI'
        required: false
        default: 'qwen-plus-character'

  push:
    paths:
      - 'scripts/demo_mnemonics.py'
      - '.github/workflows/demo-mnemonics.yml'

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai openpyxl

      - name: List data folder (debug)
        run: |
          echo "=== data/ folder ==="
          ls -la data/

      - name: Run demo mnemonics
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_MODEL: ${{ github.event.inputs.tmodel || 'qwen-plus-character' }}
          DEMO_LIMIT: ${{ github.event.inputs.demo_limit || '20' }}
          DELAY_BETWEEN: '2.0'
        run: |
          python scripts/demo_mnemonics.py

      - name: Show result
        if: always()
        run: |
          echo "=== File output ==="
          ls -la data/mnemonics_demo.json || echo "Chưa có output"
          echo ""
          echo "=== Số mẹo đã sinh ==="
          python -c "import json; d=json.load(open('data/mnemonics_demo.json')); print(len(d), 'mẹo')" || echo "Chưa có file hoặc lỗi"

      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f "data/mnemonics_demo.json" ]; then
            git add data/mnemonics_demo.json

            if git diff --quiet && git diff --staged --quiet; then
              echo "✅ Không có thay đổi để commit"
            else
              COUNT=$(python -c "import json; print(len(json.load(open('data/mnemonics_demo.json'))))" 2>/dev/null || echo "0")
              git commit -m "🤖 Demo mnemonics ($COUNT từ) [skip ci]"
              git pull --rebase origin main || true
              git push || echo "⚠️  Push failed"
            fi
          else
            echo "⚠️  Không có file output để commit"
          fi
